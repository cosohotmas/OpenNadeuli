<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오픈나들이 · 휠체어·보행 약자를 위한 무장애 관광 AI 에이전트</title>
  <meta name="description" content="공공 무장애 데이터 3종(열린관광지·무장애 탐방로·상권정보)을 조합해 헛걸음 없는 나들이 코스를 추천하는 AI 에이전트" />
  <style>
/* ============================================================
   오픈나들이 — 가독성 중심 UI (고령층·보호자 배려 설계)
   기본 글자 크기 18px 이상, 고대비, 큰 터치 영역
   ============================================================ */

:root {
  --bg: #eef4f1;
  --panel: #ffffff;
  --ink: #22303a;
  --muted: #5c6b74;
  --line: #dde7e2;

  --brand: #0f766e;
  --brand-dark: #0a544e;
  --brand-soft: #ddf1ec;
  --brand-softer: #eef8f5;

  --user-bubble: #0f766e;

  --ok-green: #0b6e4f;
  --ok-blue: #1d4fa1;
  --ok-amber: #a46500;
  --ok-purple: #6b3fa0;
  --ok-slate: #44576b;

  --radius: 18px;
  --shadow: 0 2px 14px rgba(34, 64, 56, 0.10);
}

* { box-sizing: border-box; }

/* hidden 속성은 작성자 CSS(display:grid 등)보다 항상 우선 — 모달·토스트 확실한 숨김 */
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  font-size: 18px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.app {
  height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 16px;
}

/* ------------------------------ 헤더 ------------------------------ */

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 4px;
  flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

.brand-logo {
  width: 54px; height: 54px;
  display: grid; place-items: center;
  font-size: 30px;
  background: linear-gradient(135deg, var(--brand) 0%, #14a08f 100%);
  border-radius: 16px;
  box-shadow: var(--shadow);
}

.brand-text h1 {
  margin: 0;
  font-size: 23px;
  letter-spacing: -0.3px;
  color: var(--brand-dark);
}
.brand-text p { margin: 2px 0 0; font-size: 14.5px; color: var(--muted); }

.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.data-badge {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--brand-dark);
  background: var(--brand-soft);
  border: 1px solid #bfe3da;
  padding: 5px 12px;
  border-radius: 999px;
  white-space: nowrap;
}

/* ------------------------------ 버튼 ------------------------------ */

.btn {
  font: inherit;
  font-weight: 700;
  border: none;
  border-radius: 12px;
  padding: 10px 16px;
  cursor: pointer;
  transition: transform 0.08s ease, filter 0.15s ease, background 0.15s ease;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.55; cursor: default; }

.btn-primary {
  background: var(--brand);
  color: #fff;
  box-shadow: 0 3px 10px rgba(15, 118, 110, 0.35);
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }

.btn-ghost {
  background: var(--panel);
  color: var(--brand-dark);
  border: 1.5px solid var(--line);
}
.btn-ghost:hover:not(:disabled) { background: var(--brand-softer); }

.btn-lg { padding: 13px 22px; font-size: 18.5px; border-radius: 14px; }

/* ------------------------------ 채팅 ------------------------------ */

.chat {
  overflow-y: auto;
  padding: 8px 2px 20px;
  scroll-behavior: smooth;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.msg { display: flex; gap: 12px; align-items: flex-start; }
.msg.user { justify-content: flex-end; }
.msg.user .bubble {
  background: var(--user-bubble);
  color: #fff;
  border-radius: 20px 20px 6px 20px;
  padding: 13px 18px;
  max-width: min(78%, 640px);
  font-size: 18.5px;
  box-shadow: var(--shadow);
}
.msg.user p { margin: 0; white-space: pre-wrap; }

.avatar {
  width: 44px; height: 44px;
  flex: 0 0 44px;
  display: grid; place-items: center;
  font-size: 24px;
  background: var(--brand-soft);
  border-radius: 50%;
  margin-top: 4px;
}

.msg.agent .bubble {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px 20px 20px 20px;
  padding: 16px 18px;
  max-width: min(92%, 860px);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.intro { white-space: pre-wrap; font-size: 18.5px; }

/* ------------------- 에이전트 추론 타임라인 ------------------- */

.timeline { display: flex; flex-direction: column; gap: 0; }

.step {
  position: relative;
  display: flex;
  gap: 12px;
  padding: 8px 0 8px 0;
}

.step .dot {
  width: 30px; height: 30px;
  flex: 0 0 30px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 14px;
  font-weight: 800;
  background: var(--brand-softer);
  border: 2px solid var(--brand-soft);
  color: var(--brand-dark);
  margin-top: 1px;
}
.step.done .dot { background: var(--brand); border-color: var(--brand); color: #fff; }

.step-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

.step-title { font-weight: 700; font-size: 16.5px; }
.step-icon { font-size: 17px; }

.step-detail { font-size: 15.5px; color: var(--muted); }

.step-note {
  font-size: 14.5px;
  color: #8a5b12;
  background: #fdf5e3;
  border-left: 3px solid #eec76a;
  padding: 5px 10px;
  border-radius: 0 8px 8px 0;
}

.spinner {
  width: 15px; height: 15px;
  border: 3px solid #bfe3da;
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 의도 분석 배지 */
.intent-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.intent-chip {
  font-size: 14px;
  font-weight: 700;
  color: var(--brand-dark);
  background: var(--brand-softer);
  border: 1px solid #cfe8e0;
  border-radius: 999px;
  padding: 3px 11px;
  white-space: nowrap;
}

/* 도구 호출 칩 (Function Calling 표시) */
.tool-chip { font-size: 13.5px; }
.tool-chip summary {
  cursor: pointer;
  list-style: none;
  background: #f3f7f5;
  border: 1px dashed #c9d8d1;
  border-radius: 10px;
  padding: 6px 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: #3c4a53;
}
.tool-chip summary::-webkit-details-marker { display: none; }
.tool-chip summary code {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 13px;
}
.tool-chip pre {
  margin: 6px 0 0;
  padding: 10px 12px;
  background: #22303a;
  color: #d9f2e9;
  border-radius: 10px;
  font-size: 12.5px;
  line-height: 1.55;
  overflow-x: auto;
}

/* ------------------------------ 코스 카드 ------------------------------ */

.course {
  display: flex;
  flex-direction: column;
  gap: 12px;
  border-left: 3px solid var(--brand-soft);
  margin-left: 14px;
  padding-left: 18px;
}

.card {
  display: flex;
  gap: 14px;
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}

.card-rail {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex: 0 0 52px;
}

.card-order {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  background: var(--brand);
  color: #fff;
  border-radius: 50%;
  font-size: 21px;
  font-weight: 800;
  box-shadow: 0 3px 8px rgba(15, 118, 110, 0.35);
}

.phase {
  font-size: 13px;
  font-weight: 800;
  color: var(--brand-dark);
  background: var(--brand-softer);
  border-radius: 999px;
  padding: 3px 10px;
  white-space: nowrap;
}

.card-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }

.card-head { display: flex; gap: 12px; align-items: center; }

.card-emoji {
  width: 50px; height: 50px;
  flex: 0 0 50px;
  display: grid; place-items: center;
  font-size: 28px;
  background: var(--brand-softer);
  border-radius: 14px;
}

.card-names h3 { margin: 0; font-size: 19.5px; letter-spacing: -0.2px; }
.card-type { font-size: 14px; color: var(--muted); font-weight: 600; }

.card-addr { font-size: 15.5px; color: var(--muted); }

/* 안심 체크포인트 배지 */
.badges { display: flex; flex-wrap: wrap; gap: 7px; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 14px;
  font-weight: 800;
  padding: 5px 12px;
  border-radius: 999px;
  white-space: nowrap;
}
.b-rental     { background: #e7f5ed; color: var(--ok-green); }
.b-toilet     { background: #e7eefc; color: var(--ok-blue); }
.b-enterable  { background: #e7f5ed; color: var(--ok-green); }
.b-elevator   { background: #e7eefc; color: var(--ok-blue); }
.b-parking    { background: #e8ecf1; color: var(--ok-slate); }
.b-slope8     { background: #fff3dd; color: var(--ok-amber); }
.b-handrail   { background: #e8ecf1; color: var(--ok-slate); }
.b-restArea   { background: #e8ecf1; color: var(--ok-slate); }
.b-stepFree   { background: #f2e8fb; color: var(--ok-purple); }
.b-lowTable   { background: #fdeee6; color: #a04c1c; }

.card-details { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14.5px; color: var(--muted); }
.card-details b { color: #3c4a53; margin-right: 4px; }

.card-tip {
  font-size: 15.5px;
  background: var(--brand-softer);
  border-radius: 10px;
  padding: 8px 12px;
  color: #2c4a43;
}

.card-links a { font-size: 15px; font-weight: 700; color: var(--brand); text-decoration: none; }
.card-links a:hover { text-decoration: underline; }

/* 안심 요약 */
.summary {
  background: var(--brand-softer);
  border: 1.5px solid #cfe8e0;
  border-radius: 14px;
  padding: 12px 16px;
}
.summary strong { color: var(--brand-dark); font-size: 17px; }
.summary ul { margin: 8px 0 2px; padding-left: 20px; }
.summary li { font-size: 15.5px; margin: 3px 0; }

/* 초대장 버튼 */
.invite-row { display: flex; }

/* ------------------------------ 칩 ------------------------------ */

.chips { display: none; flex-direction: column; gap: 8px; }
.chips.visible { display: flex; }

.chips-label { font-size: 14.5px; color: var(--muted); font-weight: 600; }

.chip {
  font: inherit;
  font-size: 16px;
  font-weight: 700;
  text-align: left;
  color: var(--brand-dark);
  background: var(--panel);
  border: 1.5px solid #cfe8e0;
  border-radius: 999px;
  padding: 9px 18px;
  cursor: pointer;
  transition: background 0.15s ease;
  white-space: nowrap;
}
.chip:hover:not(:disabled) { background: var(--brand-softer); }
.chip:disabled { opacity: 0.55; cursor: default; }

/* ------------------------------ 입력 영역 ------------------------------ */

.composer {
  position: sticky;
  bottom: 0;
  background: linear-gradient(to top, var(--bg) 78%, rgba(238, 244, 241, 0));
  padding: 10px 0 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.quick-chips { display: flex; flex-direction: column; gap: 6px; }
.quick-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 6px;
  scrollbar-width: thin;
}
.quick-row .chip { flex: 0 0 auto; }

.composer-form { display: flex; gap: 10px; }

.composer-form input {
  flex: 1;
  font: inherit;
  font-size: 18px;
  padding: 14px 18px;
  border: 2px solid #cfe0d9;
  border-radius: 14px;
  outline: none;
  background: var(--panel);
  color: var(--ink);
  min-width: 0;
}
.composer-form input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15); }
.composer-form input:disabled { background: #f3f6f4; }

/* ------------------------------ 모달 ------------------------------ */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(20, 34, 30, 0.45);
  display: grid;
  place-items: center;
  padding: 16px;
  z-index: 50;
}

.modal {
  background: var(--panel);
  border-radius: 20px;
  box-shadow: 0 12px 48px rgba(0, 0, 0, 0.25);
  width: min(560px, 100%);
  max-height: 90dvh;
  overflow-y: auto;
  padding: 22px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.modal-wide { width: min(680px, 100%); }

.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.modal-head h2 { margin: 0; font-size: 21px; color: var(--brand-dark); }

.modal-close {
  font-size: 18px;
  border: none;
  background: var(--brand-softer);
  color: var(--brand-dark);
  width: 38px; height: 38px;
  border-radius: 10px;
  cursor: pointer;
}

.modal-desc { margin: 0; font-size: 15px; color: var(--muted); }
.modal-desc b { color: #3c4a53; }

.check-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 16.5px;
  font-weight: 700;
  color: #3c4a53;
}
.check-row input { width: 20px; height: 20px; accent-color: var(--brand); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 15px; font-weight: 700; color: #3c4a53; }
.field input {
  font: inherit;
  font-size: 15.5px;
  padding: 11px 14px;
  border: 2px solid #cfe0d9;
  border-radius: 12px;
  outline: none;
}
.field input:focus { border-color: var(--brand); }

.test-result {
  font-size: 14.5px;
  background: var(--brand-softer);
  border-radius: 10px;
  padding: 10px 12px;
  color: #2c4a43;
}

.modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* 초대장 미리보기 */
.invite-preview { display: flex; }
#inviteLinks { display: grid; gap: .4rem; margin-block: .7rem; }

.invite-preview + textarea,
.modal textarea {
  font: inherit;
  font-size: 15px;
  line-height: 1.6;
  border: 2px solid #cfe0d9;
  border-radius: 12px;
  padding: 12px 14px;
  outline: none;
  resize: vertical;
  min-height: 220px;
}
.modal textarea:focus { border-color: var(--brand); }

/* ------------------------------ 토스트 ------------------------------ */

.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  background: #22303a;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  padding: 12px 22px;
  border-radius: 999px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
  z-index: 60;
}

/* ------------------------------ 반응형 ------------------------------ */

@media (max-width: 720px) {
  body { font-size: 17px; }
  .app { padding: 0 10px; }
  .brand-text h1 { font-size: 20px; }
  .brand-logo { width: 46px; height: 46px; font-size: 26px; }
  .msg.agent .bubble { max-width: 100%; padding: 14px; }
  .msg.user .bubble { max-width: 88%; }
  .course { margin-left: 8px; padding-left: 10px; }
  .card { flex-direction: column; gap: 8px; }
  .card-rail { flex-direction: row; justify-content: flex-start; }
  .card-order { width: 38px; height: 38px; font-size: 18px; }
  .phase { order: -1; margin-left: 4px; }
  .btn-lg { font-size: 17px; }
  .modal { padding: 18px; }
}

/* 스크롤바 */
.chat::-webkit-scrollbar { width: 10px; }
.chat::-webkit-scrollbar-thumb { background: #cfe0d9; border-radius: 8px; }
.quick-row::-webkit-scrollbar { height: 6px; }
.quick-row::-webkit-scrollbar-thumb { background: #cfe0d9; border-radius: 6px; }
.tb-chips::-webkit-scrollbar { height: 6px; }
.tb-chips::-webkit-scrollbar-thumb { background: #cfe0d9; border-radius: 6px; }

/* ------------------- 시간대 인라인 바 + 상세 팝오버 ------------------- */

/* 한 줄 슬림 필: 컴포저 안 입력창 바로 위, 칩 하나 크기의 인라인 바 */
.timebar-inline {
  position: relative;   /* 하위 패널 기준점 */
  margin: 2px 0;
}

.tb-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  color: var(--brand-dark);
  font: inherit; font-size: 15px; font-weight: 500;
  cursor: pointer;
  box-shadow: 0 1px 6px rgba(34, 64, 56, 0.08);
}
.tb-pill:hover { background: var(--brand-softer); border-color: var(--brand); }
.tb-pill:focus-visible { outline: 3px solid #9adbd0; outline-offset: 2px; }
.tb-pill-value { font-weight: 700; color: var(--ink); }
.tb-pill.open { border-color: var(--brand); background: var(--brand-soft); }
.tb-caret { font-size: 12px; color: var(--muted); transition: transform 0.15s ease; }
.tb-pill.open .tb-caret { transform: rotate(180deg); }

/* 상세 패널: 필 버튼 아래로 펼쳐지는 아코디언 */
.tb-panel {
  width: 100%;
  margin-top: 8px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 10px 14px;
  box-shadow: var(--shadow);
}

.tb-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* 여행 형태 탭: 당일 / 1박 2일 */
.tb-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tb-tab {
  padding: 7px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  color: var(--ink);
  font: inherit; font-size: 15px; font-weight: 500;
  cursor: pointer;
}
.tb-tab:hover { background: var(--brand-softer); }
.tb-tab.active {
  background: var(--brand-soft);
  border-color: var(--brand);
  color: var(--brand-dark);
  font-weight: 700;
}
.tb-tab:focus-visible { outline: 3px solid #9adbd0; outline-offset: 2px; }

/* 1박 2일: 일차 탭 + 숙소 체크박스 */
.tb-day-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-wrap: wrap;
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--brand-softer);
  border-radius: 12px;
}
.tb-daytabs { display: flex; gap: 6px; }
.tb-daytab {
  padding: 5px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  font: inherit; font-size: 14px;
  cursor: pointer;
}
.tb-daytab.active {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
  font-weight: 700;
}
.tb-hotel { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; cursor: pointer; }
.tb-hotel input { width: 19px; height: 19px; accent-color: var(--brand); }

.btn-sm { font-size: 14px; padding: 6px 12px; }

/* 가로 스크롤: 손가락 스와이프로 좌우 이동 (넓은 화면에서는 전체 표시) */
.timebar-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin: 6px -4px 0;
  padding: 0 4px 2px;
}
.timebar-inner { min-width: 560px; }

/* 트랙: 구역 배경 + 채움 + 듀얼 썸. touch-action:none으로 터치 드래그 전용 */
.tb-track {
  position: relative; height: 42px; margin-top: 4px; border-radius: 12px;
  background: linear-gradient(90deg,
    #e3f2e9 0 33.333%, #fdeed2 33.333% 50%, #e2edfa 50% 83.333%, #f3e6f5 83.333% 100%);
  touch-action: none;
  cursor: pointer;
}
.tb-fill {
  position: absolute; top: 8px; bottom: 8px;
  background: rgba(15, 118, 110, 0.30);
  border-radius: 10px;
  pointer-events: none;
}
.tb-thumb {
  position: absolute; top: 50%; transform: translate(-50%, -50%);
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--brand); border: 3px solid #fff;
  box-shadow: 0 2px 8px rgba(10, 84, 78, 0.45);
  cursor: grab; touch-action: none; padding: 0;
}
.tb-thumb:active { cursor: grabbing; }
.tb-thumb:focus-visible { outline: 3px solid #9adbd0; outline-offset: 2px; }

.tb-ticks { position: relative; height: 20px; margin-top: 2px; }
.tb-tick {
  position: absolute; transform: translateX(-50%);
  font-size: 12px; color: var(--muted);
}
.tb-tick:first-child { transform: none; }          /* 양끝 잘림 방지 */
.tb-tick:last-child { transform: translateX(-100%); }

/* 타임블록 칩: 가로 스크롤(스와이프) */
.tb-chips {
  display: flex; gap: 8px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  padding: 6px 2px 2px;
}
.tb-chip { flex: 0 0 auto; }
.tb-chip.active {
  background: var(--brand-soft);
  border-color: var(--brand);
  color: var(--brand-dark);
  font-weight: 700;
}

/* 실시간 피드백 문구 */
.tb-summary { margin: 2px 0 0; font-size: 16px; color: var(--ink); min-height: 26px; }
.tb-summary::before { content: "→ "; color: var(--brand); font-weight: 700; }

@media (max-width: 720px) {
  .tb-panel { padding: 8px 10px; }
  .tb-summary { font-size: 15px; }
}

/* ---------- 전체 동선 지도 ---------- */
.route-section {
  margin: 14px 0;
  scroll-margin-block-start: 10px;
  padding: 14px 16px 16px;
  background: var(--brand-softer);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.route-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}
.route-head h2 { margin: 0; font-size: 16px; color: var(--ink); }
.route-map-wrap { position: relative; margin-bottom: 12px; }
.route-map { height: 300px; border-radius: 12px; background: #e6efe9; z-index: 0; }
.route-map-hint {
  position: absolute;
  left: 10px;
  bottom: 10px;
  z-index: 800;
  background: rgba(255, 255, 255, 0.94);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 11px;
  color: var(--muted);
  box-shadow: 0 1px 5px rgba(0, 0, 0, 0.18);
  pointer-events: auto;
  max-width: calc(100% - 20px);
}
.route-map-wrap.route-map-off .route-map { display: none; }
.route-map-wrap.route-map-off .route-map-hint { position: static; margin: 8px 2px; }

/* 번호 핀 (카카오맵 커스텀 오버레이) */
.route-pin-group { display: flex; gap: 7px; padding: 6px; }
.route-pin:focus-visible { outline: 3px solid #005fcc; outline-offset: 2px; }
.route-pin {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  padding: 0;
  border-radius: 50% 50% 50% 4px;
  transform: rotate(-45deg);
  background: var(--brand);
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  cursor: pointer;
}
.route-pin > span { transform: rotate(45deg); color: #fff; font-size: 12px; font-weight: 700; }
.route-pin.kakao:hover { background: var(--brand-dark); }

/* 말풍선 (카카오맵 인포윈도우) */
.route-popup b { display: block; font-size: 13px; margin: 2px 0 3px; color: var(--ink); }
.route-popup .popup-addr { display: block; color: var(--muted); font-size: 11px; margin-bottom: 5px; }
.route-popup .popup-badges i {
  display: inline-block;
  font-style: normal;
  font-size: 10.5px;
  background: var(--brand-soft);
  color: var(--brand-dark);
  border-radius: 6px;
  padding: 1px 7px;
  margin: 1px 3px 1px 0;
}

@media (max-width: 720px) {
  .route-map { height: 240px; }
}
.route-retry {
  border: 1px solid var(--brand);
  background: var(--panel);
  color: var(--brand-dark);
  border-radius: 6px;
  font-size: 11px;
  padding: 2px 8px;
  margin-left: 6px;
  cursor: pointer;
}
.route-retry:hover { background: var(--brand-soft); }

</style>
</head>
<body>
  <div class="app">
    <!-- 헤더 -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">🦽</div>
        <div class="brand-text">
          <h1>오픈나들이</h1>
          <p>휠체어·보행 약자를 위한 무장애 관광 AI 에이전트</p>
        </div>
      </div>
      <div class="header-actions">
        <span id="dataSourceBadge" class="data-badge">내장 샘플 데이터</span>
        <button id="resetBtn" class="btn btn-ghost reset-chat" type="button" aria-label="대화 초기화"><span aria-hidden="true">↺</span><span class="reset-chat-label"> 대화 초기화</span></button>
      </div>
    </header>

    <!-- 대화 영역 -->
    <main id="chat" class="chat" aria-live="polite" aria-label="오픈나들이 AI 에이전트 대화"></main>

    <!-- 입력 영역 -->
    <div class="composer">
      <button id="quickToggle" class="btn quick-toggle" type="button" aria-controls="quickChips" aria-expanded="true">추천 검색 ▴</button>
      <div id="quickChips" class="quick-chips" role="group" aria-label="상황별 원클릭 추천 질문"></div>

      <!-- 일정·시간대 설정: 평소 한 줄 필, 클릭 시 아래로 아코디언 펼침 -->
      <div class="timebar-inline">
        <button id="timebarToggle" class="tb-pill" type="button" aria-expanded="false"
                aria-controls="tbPanel" title="일정·시간대 및 지역 설정 펼치기/접기">
          <span aria-hidden="true">⚙️</span><span>일정·시간대 및 지역 설정</span>
          <span id="tbHeadSummary" class="tb-pill-value"></span>
          <span class="tb-caret" aria-hidden="true">▾</span>
        </button>

        <!-- 상세 설정 패널 (아코디언: 버튼 아래로 펼쳐짐) -->
        <div id="tbPanel" class="tb-panel" hidden>
          <div class="search-region">
            <span>검색 지역</span><div id="searchRegion"></div>
          </div>
          <div class="tb-panel-head">
            <div class="tb-tabs" role="tablist" aria-label="여행 형태 선택">
              <button type="button" class="tb-tab" data-trip="day" role="tab">당일 코스</button>
              <button type="button" class="tb-tab" data-trip="overnight" role="tab">1박 2일 코스</button>
            </div>
            <button id="timebarReset" class="btn btn-ghost btn-sm" type="button" title="기본값으로 되돌리기">↺ 초기화</button>
          </div>

          <!-- 1박 2일일 때만 표시: 날짜별 슬라이더 전환 + 숙소 옵션 -->
          <div id="tbDayRow" class="tb-day-row" hidden>
            <div class="tb-daytabs" role="tablist" aria-label="일차 선택">
              <button type="button" class="tb-daytab" data-day="1" role="tab">1일차</button>
              <button type="button" class="tb-daytab" data-day="2" role="tab">2일차</button>
            </div>
            <label class="tb-hotel">
              <input type="checkbox" id="tbHotel" />
              🏨 휠체어 이용 가능 숙소(호텔) 추천 포함
            </label>
          </div>

          <!-- 듀얼 썸 타임라인 슬라이더 (00시~24시 전체 범위) -->
          <div class="timebar-scroll" tabindex="0" aria-label="시간대 타임라인 (00시~24시, 가로 스크롤)">
            <div class="timebar-inner">
              <div class="tb-track" id="tbTrack">
                <div class="tb-fill" id="tbFill"></div>
                <button type="button" class="tb-thumb" id="tbThumbS" role="slider"
                        aria-label="활동 시작 시간" aria-valuemin="0" aria-valuemax="24" tabindex="0"></button>
                <button type="button" class="tb-thumb" id="tbThumbE" role="slider"
                        aria-label="활동 종료 시간" aria-valuemin="0" aria-valuemax="24" tabindex="0"></button>
              </div>
              <div class="tb-ticks" id="tbTicks" aria-hidden="true"></div>
            </div>
          </div>

          <!-- 고정 활동 대신 옵션만 선택 -->
          <div id="tbChips" class="tb-chips" role="group" aria-label="일정 옵션"></div>
          <p id="tbSummary" class="tb-summary" aria-live="polite"></p>
        </div>
      </div>

      <button id="locationRetry" type="button" class="btn location-retry" hidden></button>
      <form id="chatForm" class="composer-form" autocomplete="off">
        <input id="chatInput" type="text" inputmode="text"
               placeholder="예) 주말에 휠체어 타고 산책할 만한 부산 근교 나들이 장소 찾아줘"
               aria-label="메시지 입력" />
        <button id="sendBtn" type="submit" class="btn btn-primary btn-lg">전송 ✉️</button>
      </form>
    </div>
  </div>

  <!-- 초대장 모달 -->
  <div id="inviteModal" class="modal-backdrop" hidden>
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="inviteTitle">
      <div class="modal-head">
        <h2 id="inviteTitle">💌 나들이 초대장 (가족 단톡방 공유용)</h2>
        <button class="modal-close" type="button" data-close="inviteModal" aria-label="닫기">✕</button>
      </div>
      <textarea id="inviteText" rows="12" spellcheck="false" aria-label="초대장 텍스트 편집"></textarea>
      <div id="inviteLinks" aria-label="장소별 빠른 링크"></div>
      <div class="modal-actions">
        <button class="btn btn-primary btn-lg" id="copyInviteBtn" type="button">📋 초대장 전체 복사</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="/src/elice-final.js"></script>
</body>
</html>
